[project]
name = "vision-inference-microservice"
version = "0.1.0"
description = "Production-grade object detection inference microservice powered by YOLOv8 and FastAPI"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The ``client`` fixture is session-scoped so the model loads once; the tests
# pin a matching session loop scope on their own markers.
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# ultralytics and cv2 ship no py.typed marker / stubs.
[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*"]
ignore_missing_imports = true
# ultralytics re-exports YOLO from a submodule without an explicit __all__.
implicit_reexport = true
