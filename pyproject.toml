[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-inference-microservice"
version = "0.1.0"
description = "YOLOv8 object detection service with interchangeable PyTorch, ONNX Runtime, OpenVINO and TensorRT backends"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nati2126" }]
# requirements.txt holds the exact pins used by Docker and CI.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3.57,<8.4",
    "torch>=2.0",
    # Conflicts with onnxruntime-gpu; uninstall it before installing [gpu].
    "onnxruntime>=1.20",
    # 1.18+ writes IR 11, which onnxruntime 1.20 cannot load.
    "onnx>=1.17,<1.18",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.20"]
openvino = ["openvino>=2025.0"]
tensorrt = ["tensorrt-cu12>=10.0,<11"]
bench = ["psutil>=5.9", "nvidia-ml-py>=12.0"]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "benchmark", "scripts"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*", "onnxruntime.*", "openvino.*", "tensorrt.*", "pynvml.*", "psutil.*"]
ignore_missing_imports = true
implicit_reexport = true
