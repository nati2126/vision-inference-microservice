name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types, tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt pins `torch>=2.0.0`, which resolves to the CUDA build
      # on PyPI and drags in several GB of nvidia wheels. The runner has no
      # GPU, so install the CPU build first; the next step then sees the
      # requirement already satisfied.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      # CPU scope only: PyTorch + ONNX Runtime. OpenVINO and TensorRT are
      # optional extras; their tests skip when the package is absent.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # yolov8n.pt is downloaded on first model load (MODEL_WEIGHTS_DIR), and
      # the test fixtures export models/yolov8n{.pt,.onnx} when missing.
      # Caching both keeps the suite off the network on most runs.
      - name: Cache model weights and exports
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vision-inference/weights
            models
          key: models-${{ hashFiles('requirements.txt', 'scripts/export_models.py') }}
          restore-keys: models-

      # mypy follows torch's very large stubs; a warm cache cuts the check
      # from minutes to seconds.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: mypy-

      - name: Lint
        run: |
          ruff check app/ tests/ scripts/ benchmark/
          ruff format --check app/ tests/ scripts/ benchmark/

      - name: Type check
        run: mypy app/ scripts/ benchmark/

      - name: Test
        run: pytest -v --tb=short -rs

  docker:
    name: Image builds and serves
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vision-inference:ci .

      # Proves the service actually starts as the non-root user: ultralytics
      # writes model weights on first load, and the working directory is not
      # writable by that user.
      - name: Start container
        run: docker run -d --name vision-ci -p 8000:8000 vision-inference:ci

      - name: Wait for healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              echo && echo "service is healthy" && exit 0
            fi
            sleep 5
          done
          echo "service never became healthy"
          exit 1

      - name: Smoke-test detection
        run: |
          curl -fsSL -o bus.jpg https://ultralytics.com/images/bus.jpg
          curl -fsS -X POST http://localhost:8000/api/v1/detect -F "file=@bus.jpg"

      - name: Container logs
        if: always()
        run: docker logs vision-ci
